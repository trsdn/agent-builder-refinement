# This repository contains Markdown documentation and agent templates only:
# there is no source code, no package manifest, no build step and no unit test
# suite, so CI checks the things that genuinely exist here - that the Markdown
# is well formed, that the agent and prompt templates parse, and that the
# documentation does not link to files that are missing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Rules come from .markdownlint-cli2.jsonc in the repository root.
      # The globs are set explicitly because the action defaults to
      # "*.{md,markdown}", which only matches the repository root.
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  validate-docs:
    name: Templates and links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate agent templates and relative links
        run: python scripts/validate_docs.py
